[package]
name = "table-vault"
description = "Dark Table poker vault: holds player NEAR, records provably-fair hand commits/reveals and settles zero-sum hand results"
version = "0.1.0"
edition = "2021"
rust-version = "1.86"
resolver = "3"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "=5.14.0"

[dev-dependencies]
near-sdk = { version = "=5.14.0", features = ["unit-testing"] }
sha2 = "0.10"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
